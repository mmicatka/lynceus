---
# conf/params.yaml

s3_endpoint: 192.168.1.4:3900
s3_region: garage
s3_url_style: path

candidates:
  num_per_shard: 1000000
  bucket: lynceus

  filter_config: "/app/lynceus/work/conf/examples/physiochemical_filter.yaml"

surrogate:
  train:
    sample:
      seed: 1000
      num_samples: 100000
      stratify_on: ["scaffold_hash"]
      num_bins: 50
      projection:
        method: "sparse_random"
        n_components: 32

target:
  ensemble_id: "T4_lysozyme_L99"
  ensemble_path: "s3://lynceus/targets/protein_ensembles/T4_lysozyme_L99"
  bucket: lynceus
