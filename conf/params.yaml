---
# conf/params.yaml

s3_endpoint: 192.168.1.4:3900
s3_region: garage
s3_url_style: path

candidates:
  bucket: lynceus
  num_per_shard: 100000
  source_prefix: candidates/raw
  sources:
    - H04
    - H05
    - H06
    - H07
    - H08
    - H09
    - H10
    - H11
    - H12
    - H13
    - H14
    - H15
  target_total: 1000000
  floor_per_source: 50000
  candidate_samples_prefix: candidates/sampled
  shard_output_prefix: candidates/shards
  conformers_output_prefix: candidates/conformers

  filter_config:
    pains:
      enabled: true

    cns_mpo:
      enabled: true
      min_score: 4.0

surrogate:
  train:
    sample:
      seed: 1000
      num_samples: 250000
      fields:
        - name: morgan_fingerprint
          kind: array
          reduced_dims: 32
        - name: molecular_weight
          kind: scalar
        - name: calculated_distribution_coefficient
          kind: scalar
        - name: topological_polar_surface_area
          kind: scalar

target:
  ensemble_id: "T4_lysozyme_L99"
  ensemble_path: "s3://lynceus/targets/protein_ensembles/T4_lysozyme_L99"
  bucket: lynceus
