---
# conf/params.yaml

s3_endpoint: 192.168.1.4:3900
s3_region: garage
s3_url_style: path

candidates:
  uri_list: assets/candidates.sample.txt
  filter_config: "/app/lynceus/work/conf/examples/physiochemical_filter.yaml"
  num_shards: 8
  output_bucket: lynceus

surrogate_model:
  training:
    seed: 1000
    num_samples: 10000

target:
  ensemble:
    ensemble_id: "T4_lysozyme_L99_static"
    type: "static"
    components:
      - pdb_id: "1L83"
        weight: 1.0

    capabilities_required:
      - "standalone_cif"
