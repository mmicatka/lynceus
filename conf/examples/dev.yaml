---
# conf/examples/dev.yaml

# uri_list: assets/candidate_uris.blackhole.txt
candidates_local_path: assets/.local/*

outdir: results/dev

filter:
  config: conf/examples/physiochemical_filter.yaml
  batch_size: 10000

surrogate_model:
  training:
    seed: 1000
    num_samples: 1000

target:
  ensemble:
    ensemble_id: "1STP_static_v1"
    type: "static"
    components:
      - pdb_id: "1STP"
        weight: 1.0

    capabilities_required:
      - "standalone_cif"
