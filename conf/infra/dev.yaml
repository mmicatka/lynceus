---
storage:
  prefixes:
    candidates:
      raw_smiles: candidates/raw/smiles
      raw_parquet: candidates/raw/parquet
      shards_staging: candidates/shards_staging
      shards: candidates/shards
      shards_sample: candidates/shards_sample
      conformers: candidates/conformers
      features: candidates/features
    target:
      pdbs: target/pdbs
      ensembles: target/ensembles

candidates:
  num_shards: 32
  # num_shards: 512

templates:
  load_candidates:
    resources: &med_cpu
      requests: &med_cpu_res
        cpu: "4"
        memory: 3Gi
      limits: *med_cpu_res
    image: &candidates_image
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
  shard_candidates:
    resources: &high_cpu
      requests: &high_cpu_res
        cpu: "8"
        memory: 8Gi
      limits: *high_cpu_res
    image: *candidates_image
    scratch: &scratch
      mount_path: /scratch
      size_limit: 50Gi
  merge_shards:
    resources: *high_cpu
    image: *candidates_image
  subsample_candidates:
    resources: *high_cpu
    image: *candidates_image
  generate_conformers:
    resources: *med_cpu
    image: *candidates_image
  generate_features:
    resources: *med_cpu
    image: *candidates_image
  download_pdbs:
    resources: &low_cpu
      requests: &low_cpu_res
        cpu: "2"
        memory: 1Gi
      limits: *low_cpu_res
    image: &targets_image
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
  generate_manifest:
    resources: *low_cpu
    image: *targets_image

volume:
  name: lynceus
  claim_name: lynceus-pvc
  mount_path: /mnt/lynceus
