---
storage:
  bucket: lynceus
  prefixes:
    candidates:
      raw_smiles: candidates/raw/smiles
      raw_parquet: candidates/raw/parquet
      shards_staging: candidates/shards_staging
      shards: candidates/shards
      shards_sample: candidates/shards_sample
      conformers: candidates/conformers
      features: candidates/features

candidates:
  num_shards: 16

templates:
  default:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 4Gi
  overrides:
    shard_candidates:
      requests:
        cpu: "8"
        memory: 8Gi
      limits:
        cpu: "8"
        memory: 8Gi
volume:
  name: lynceus
  claim_name: lynceus-workdir
  mount_path: /mnt/lynceus

images:
  candidates:
    image: registry.nebula.lan:5000/lynceus-candidates:0.1.0
