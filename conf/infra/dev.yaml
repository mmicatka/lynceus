---
storage:
  prefixes:
    candidates:
      raw_smiles: candidates/raw/smiles
      raw_parquet: candidates/raw/parquet
      shards_staging: candidates/shards_staging
      shards: candidates/shards
      shards_sample: candidates/shards_sample
      conformers: candidates/conformers
      features: candidates/features
    target:
      pdbs: target/pdbs
      ensembles: target/ensembles
    surrogate:
      samples_staging: surrogate/samples_staging
      samples: surrogate/samples

candidates:
  max_batch_gib: 20
  num_shards: 8

templates:
  load_candidates:
    resources: &med_cpu
      requests: &med_cpu_res
        cpu: "4"
        memory: 3Gi
      limits: *med_cpu_res
    image: &candidates_image
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
  shard_candidates:
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    image: *candidates_image
    scratch: &scratch
      mount_path: /scratch
      size_limit: 50Gi
  merge_shards:
    resources: &high_cpu
      requests: &high_cpu_res
        cpu: "8"
        memory: 8Gi
      limits: *high_cpu_res
    image: *candidates_image # TODO: move this into a dedicated image
  subsample_candidates:
    resources: *high_cpu
    image: *candidates_image
  generate_conformers:
    resources: *med_cpu
    image: *candidates_image
  generate_features:
    resources: *med_cpu
    image: *candidates_image
  download_pdbs:
    resources: &low_cpu
      requests: &low_cpu_res
        cpu: "2"
        memory: 1Gi
      limits: *low_cpu_res
    image: &targets_image
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
  generate_manifest:
    resources: *low_cpu
    image: *targets_image
  detect_binding_sites:
    resources: *low_cpu
    image: *targets_image
  surrogate_sample:
    resources: *high_cpu
    image: &surrogate_image
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
  run_docking:
    image:
      image: your-registry/lynceus-docking:tag
    resources:
      requests:
        cpu: "8"
        memory: 16Gi
      limits:
        cpu: "8"
        memory: 32Gi
      gpu: 1
    node_selector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    runtime_class_name: nvidia
volume:
  name: lynceus
  claim_name: lynceus-pvc
  mount_path: /mnt/lynceus
