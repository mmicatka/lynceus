# pyproject.toml

[project]
name = "lynceus-dev"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"

dependencies = [
    # libs
    "lynceus-utils",
    # utils
    "detect-binding-sites",
    "physiochemical-filter",
    "sample-candidates",
    "docking-run",
    "surrogate-model",
    "rebalance-candidates",
    "generate-conformers",
]

[tool.uv.workspace]
members = [
    # libs
    "libs/lynceus-utils",
    # utils
    "modules/local/detect_binding_sites",
    "modules/local/physiochemical_filter",
    "modules/local/sample_candidates",
    "modules/local/docking_run",
    "modules/local/surrogate_model",
    "modules/local/rebalance_candidates",
    "modules/local/generate_conformers",
]

[tool.uv.sources]

physiochemical-filter = { workspace = true }
sample-candidates = { workspace = true }
detect-binding-sites = { workspace = true }
lynceus-utils = { workspace = true }
docking-run = { workspace = true }
surrogate-model = { workspace = true }
rebalance-candidates = { workspace = true }
generate-conformers = { workspace = true }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.2.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "ruff>=0.15.21",
    "yamllint>=1.38.0",
    "pre-commit>=4.6.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
