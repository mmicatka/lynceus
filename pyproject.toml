# pyproject.toml

[project]
name = "lynceus-dev"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"

dependencies = [
    # libs
    "lynceus-core",
    # projects
    "candidates",
    "lynceus-dock",
    "surrogate-model",
    "targets",
    # workflows
    "workflows",
]

[tool.uv.workspace]
members = [
    # libs
    "libs/lynceus-core",
    # projects
    "projects/candidates",
    "projects/lynceus-dock",
    "projects/surrogate-model",
    "projects/targets",
    # workflows
    "workflows",
]

[tool.uv.sources]
# libs
lynceus-core = { workspace = true }
# projects
candidates = { workspace = true }
lynceus-dock = { workspace = true }
surrogate-model = { workspace = true }
targets = { workspace = true }
# workflows
workflows = { workspace = true }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.2.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "ruff>=0.15.21",
    "yamllint>=1.38.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.yamlfix]
line_length = 100
