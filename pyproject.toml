# pyproject.toml

[project]
name = "lynceus-dev"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"

dependencies = [
    # libs
    "lynceus-core",
    "lynceus-utils",
    # projects
    "candidates",
    "targets",
    # utils
    "docking-run",
    "surrogate-model",
    "workflows",
]

[tool.uv.workspace]
members = [
    # libs
    "libs/lynceus-utils",
    "libs/lynceus-core",
    # projects
    "projects/candidates",
    "projects/targets",
    "modules/local/docking_run",
    "modules/local/surrogate_model",
    # workflows
    "workflows",
]

[tool.uv.sources]
candidates = { workspace = true }
targets = { workspace = true }
lynceus-utils = { workspace = true }
docking-run = { workspace = true }
surrogate-model = { workspace = true }
workflows = { workspace = true }
lynceus-core = { workspace = true }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.2.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "ruff>=0.15.21",
    "yamllint>=1.38.0",
    "pre-commit>=4.6.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.yamlfix]
line_length = 100
