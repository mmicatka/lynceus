# libs/protein-conformational-ensemble/pyproject.toml

[project]
name = "protein-conformational-ensemble"
version = "0.1.0"
description = "Reference implementation of the Protein Conformational Ensemble (PCE) specification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["blake3>=1.0.9", "jsonschema>=4.26.0", "pyyaml>=6.0.3"]

[project.scripts]
generate-manifest = "protein_conformational_ensemble.cli:generate_manifest"

[dependency-groups]
dev = ["mypy>=2.2.0", "pytest>=9.1.1", "ruff>=0.15.21"]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
