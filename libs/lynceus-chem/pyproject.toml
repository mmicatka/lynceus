[project]
name = "lynceus-chem"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Mike Micatka", email = "mike.micatka@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "polars>=1.42.1",
    "pyarrow>=24.0.0",
    "rdkit>=2026.3.3",
]

[project.scripts]
lynceus-chem-preprocess = "lynceus_chem.preprocess:preprocess"
lynceus-chem-retrieve-pdbs = "lynceus_chem.utils:retrieve_pdbs"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
