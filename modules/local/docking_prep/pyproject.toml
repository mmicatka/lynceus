# modules/local/docking_prep/docking-prep/pyproject.toml

[project]
name = "docking-prep"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Mike", email = "mike.micatka@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "blake3>=1.0.9",
  "dimorphite-dl",
  "fastparquet>=2026.5.0",
  "gemmi>=0.7.5",
  "meeko>=0.7.1",
  "pandas>=3.0.3",
  "prody>=2.6.1",
  "protein-conformational-ensemble",
  "pyarrow>=24.0.0",
  "pydantic>=2.13.4",
  "rdkit>=2026.3.3",
  "scipy>=1.18.0",
]

[project.scripts]
docking-prepare-ensemble = "docking_prep.ensemble:prepare_ensemble"
conformer-generate = "docking_prep.ligand:conformer_generate"
convert-pdbqt = "docking_prep.ligand:convert_pdbqt"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
protein-conformational-ensemble = { workspace = true }
dimorphite-dl = { git = "https://github.com/mmicatka/dimorphite_dl.git" }
