# modules/local/docking_prep/docking-prep/pyproject.toml

[project]
name = "docking-prep"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Mike", email = "mike.micatka@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "gemmi>=0.7.5",
  "meeko>=0.7.1",
  "prody>=2.6.1",
  "protein-conformational-ensemble",
  "pydantic>=2.13.4",
  "rdkit>=2026.3.3",
  "scipy>=1.18.0",
]

[project.scripts]
docking-prepare-ensemble = "docking_prep.ensemble:prepare_ensemble"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
protein-conformational-ensemble = { workspace = true }
