[project]
name = "docking-run"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Mike", email = "mike.micatka@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "gemmi>=0.7.5",
    "meeko>=0.7.1",
    "pyarrow>=24.0.0",
    "rdkit>=2026.3.4",
    "tqdm>=4.70.0",
]

[project.scripts]
docking-run = "docking_run.cli:docking_run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
