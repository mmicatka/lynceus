[project]
name = "physiochemical-filter"
version = "0.1.0"
description = "Performs physiochemical-based filtering"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
