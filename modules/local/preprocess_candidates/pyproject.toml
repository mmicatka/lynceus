# modules/local/preprocess_candidates/pyproject.toml

[project]
name = "preprocess-candidates"
version = "0.1.0"
description = "Preprocesses candidates"
requires-python = ">=3.12"
dependencies = ["polars>=1.42.1", "pyarrow>=24.0.0", "rdkit>=2026.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/preprocess_candidates"]
