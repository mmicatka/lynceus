[project]
name = "retrieve-pdb"
version = "0.1.0"
description = "Retrieve PDB files"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/retrieve_pdb"]
