apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hsp90-n-terminal-featurize-candidates-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: featurize-candidates-dag
    dag:
      tasks:
      - name: check-featurized
        template: verify-manifest-featurize-candidates
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: manifest
            value: candidates/1m/featurized/plan.manifest.json
          - name: expect
            value: '{"featurized":true,"sample":"1m"}'
          - name: source_globs
            value: '["candidates/1m/raw/*.parquet"]'
          - name: result_file
            value: /tmp/manifest_matches.txt
      - name: plan-featurize
        depends: check-featurized
        template: plan-featurize-candidates
        when: '{{tasks.check-featurized.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: input_prefix
            value: candidates/1m/raw
          - name: source_glob
            value: '*.parquet'
          - name: output_file
            value: /tmp/manifest.json
          - name: persist_file
            value: candidates/1m/featurized/plan.manifest.json
      - name: featurize-shards-fanout
        depends: plan-featurize
        template: featurize-shards-fanout-dag
        when: '{{tasks.check-featurized.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: sources
            value: '{{=toJson(fromJSON(tasks[''plan-featurize''].outputs.parameters.manifest).sources)}}'
      - name: write-manifest
        depends: featurize-shards-fanout
        template: update-manifest-featurize-candidates
        when: '{{tasks.check-featurized.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: candidates/1m/featurized/plan.manifest.json
          - name: output
            value: candidates/1m/featurized/plan.manifest.json
          - name: fields
            value: '{"featurized":true,"sample":"1m"}'
  - name: verify-manifest-featurize-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: manifest
      - name: expect
      - name: source_globs
      - name: result_file
    outputs:
      parameters:
      - name: matches
        valueFrom:
          path: /tmp/manifest_matches.txt
    retryStrategy:
      limit: 3
      retryPolicy: OnFailure
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: expect = json.loads(r'''{{inputs.parameters.expect}}''')
        except: expect = r'''{{inputs.parameters.expect}}'''
        try: manifest = json.loads(r'''{{inputs.parameters.manifest}}''')
        except: manifest = r'''{{inputs.parameters.manifest}}'''
        try: result_file = json.loads(r'''{{inputs.parameters.result_file}}''')
        except: result_file = r'''{{inputs.parameters.result_file}}'''
        try: source_globs = json.loads(r'''{{inputs.parameters.source_globs}}''')
        except: source_globs = r'''{{inputs.parameters.source_globs}}'''

        import json
        import os
        import subprocess
        cmd = ['verify-manifest', '--manifest', os.path.join(base_path, manifest), '--expect', json.dumps(expect), '--source-root', base_path, '--result-file', result_file]
        for source_glob in source_globs:
            cmd.extend(['--source-glob', source_glob])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: plan-featurize-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: input_prefix
      - name: persist_file
      - name: source_glob
        default: '*'
      - name: output_file
        default: /tmp/manifest.json
    outputs:
      parameters:
      - name: manifest
        valueFrom:
          path: /tmp/manifest.json
    retryStrategy:
      limit: 3
      retryPolicy: OnFailure
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: output_file = json.loads(r'''{{inputs.parameters.output_file}}''')
        except: output_file = r'''{{inputs.parameters.output_file}}'''
        try: persist_file = json.loads(r'''{{inputs.parameters.persist_file}}''')
        except: persist_file = r'''{{inputs.parameters.persist_file}}'''
        try: source_glob = json.loads(r'''{{inputs.parameters.source_glob}}''')
        except: source_glob = r'''{{inputs.parameters.source_glob}}'''

        import os
        import subprocess
        subprocess.run(['generate-plan', '--source-root', base_path, '--source-glob', os.path.join(input_prefix, source_glob), '--output-file', output_file, '--persist-file', os.path.join(base_path, persist_file)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: update-manifest-featurize-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: output
      - name: fields
    retryStrategy:
      limit: 3
      retryPolicy: OnFailure
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: fields = json.loads(r'''{{inputs.parameters.fields}}''')
        except: fields = r'''{{inputs.parameters.fields}}'''
        try: output = json.loads(r'''{{inputs.parameters.output}}''')
        except: output = r'''{{inputs.parameters.output}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import json
        import os
        import subprocess
        subprocess.run(['update-manifest', '--source', os.path.join(base_path, source), '--output', os.path.join(base_path, output), '--set', json.dumps(fields)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: featurize-candidate-shard
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: input_prefix
      - name: output_prefix
      - name: features
      - name: num_workers
        default: auto
    retryStrategy:
      limit: 3
      retryPolicy: OnFailure
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: features = json.loads(r'''{{inputs.parameters.features}}''')
        except: features = r'''{{inputs.parameters.features}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import os
        import subprocess
        cmd = ['featurize-candidate-shard', '--source-root', base_path, '--input', os.path.join(base_path, input_prefix, source), '--output', os.path.join(base_path, output_prefix, source), '--num-workers', str(num_workers)]
        for feature in features:
            cmd.extend(['--features', feature])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 6Gi
        requests:
          cpu: '4'
          memory: 6Gi
  - name: featurize-shard-dag
    dag:
      tasks:
      - name: featurize-shard
        template: featurize-candidate-shard
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: '{{inputs.parameters.source}}'
          - name: input_prefix
            value: candidates/1m/raw
          - name: output_prefix
            value: candidates/1m/featurized/shards
          - name: manifest_prefix
            value: candidates/1m/featurized/manifests
    inputs:
      parameters:
      - name: source
  - name: featurize-shards-fanout-dag
    dag:
      tasks:
      - name: featurize-shards
        template: featurize-shard-dag
        withParam: '{{inputs.parameters.sources}}'
        arguments:
          parameters:
          - name: source
            value: '{{item}}'
    inputs:
      parameters:
      - name: sources
  - name: main-dag
    dag:
      tasks:
      - name: featurize-candidates
        template: featurize-candidates-dag
