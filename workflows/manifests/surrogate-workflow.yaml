apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ptprb-10m-100k-valid-5-rounds-10k-surrogate-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: resolve-binding-sites
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: ensembles_prefix
      - name: ensemble_ids
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: ensemble_ids = json.loads(r'''{{inputs.parameters.ensemble_ids}}''')
        except: ensemble_ids = r'''{{inputs.parameters.ensemble_ids}}'''
        try: ensembles_prefix = json.loads(r'''{{inputs.parameters.ensembles_prefix}}''')
        except: ensembles_prefix = r'''{{inputs.parameters.ensembles_prefix}}'''

        import os
        import subprocess
        cmd = ['resolve-binding-sites', '--ensembles-root', os.path.join(base_path, ensembles_prefix)]
        for ensemble_id in ensemble_ids:
            cmd.extend(['--ensemble-id', ensemble_id])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: run-docking
    podSpecPatch: '{"runtimeClassName": "nvidia"}'
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 10Gi
    inputs:
      parameters:
      - name: base_path
      - name: ensemble
      - name: member_id
      - name: ligands_path
      - name: center
      - name: site_id
      - name: output_path
      - name: size
        default: 'null'
      - name: search_mode
        default: balance
      - name: num_modes
        default: '1'
      - name: batch_size
        default: 'null'
      - name: parquet_batch_rows
        default: '10000'
      - name: default_altloc
        default: A
      - name: allow_bad_residues
        default: 'true'
    nodeSelector:
      nvidia.com/gpu.present: 'true'
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/lynceus-dock:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: allow_bad_residues = json.loads(r'''{{inputs.parameters.allow_bad_residues}}''')
        except: allow_bad_residues = r'''{{inputs.parameters.allow_bad_residues}}'''
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: batch_size = json.loads(r'''{{inputs.parameters.batch_size}}''')
        except: batch_size = r'''{{inputs.parameters.batch_size}}'''
        try: center = json.loads(r'''{{inputs.parameters.center}}''')
        except: center = r'''{{inputs.parameters.center}}'''
        try: default_altloc = json.loads(r'''{{inputs.parameters.default_altloc}}''')
        except: default_altloc = r'''{{inputs.parameters.default_altloc}}'''
        try: ensemble = json.loads(r'''{{inputs.parameters.ensemble}}''')
        except: ensemble = r'''{{inputs.parameters.ensemble}}'''
        try: ligands_path = json.loads(r'''{{inputs.parameters.ligands_path}}''')
        except: ligands_path = r'''{{inputs.parameters.ligands_path}}'''
        try: member_id = json.loads(r'''{{inputs.parameters.member_id}}''')
        except: member_id = r'''{{inputs.parameters.member_id}}'''
        try: num_modes = json.loads(r'''{{inputs.parameters.num_modes}}''')
        except: num_modes = r'''{{inputs.parameters.num_modes}}'''
        try: output_path = json.loads(r'''{{inputs.parameters.output_path}}''')
        except: output_path = r'''{{inputs.parameters.output_path}}'''
        try: parquet_batch_rows = json.loads(r'''{{inputs.parameters.parquet_batch_rows}}''')
        except: parquet_batch_rows = r'''{{inputs.parameters.parquet_batch_rows}}'''
        try: search_mode = json.loads(r'''{{inputs.parameters.search_mode}}''')
        except: search_mode = r'''{{inputs.parameters.search_mode}}'''
        try: site_id = json.loads(r'''{{inputs.parameters.site_id}}''')
        except: site_id = r'''{{inputs.parameters.site_id}}'''
        try: size = json.loads(r'''{{inputs.parameters.size}}''')
        except: size = r'''{{inputs.parameters.size}}'''

        import subprocess
        cmd = ['run-docking', '--source-root', str(base_path), '--ensemble', str(ensemble), '--member-id', str(member_id), '--ligands-path', str(ligands_path), '--center', str(center[0]), str(center[1]), str(center[2]), '--site-id', str(site_id), '--output', str(output_path), '--search-mode', str(search_mode), '--num-modes', str(num_modes), '--parquet-batch-rows', str(parquet_batch_rows), '--default-altloc', str(default_altloc)]
        if size is not None:
            cmd.extend(['--size', str(size[0]), str(size[1]), str(size[2])])
        if batch_size is not None:
            cmd.extend(['--batch-size', str(batch_size)])
        if allow_bad_residues:
            cmd.append('--allow-bad-residues')
        subprocess.run(cmd, check=True)
      command:
      - python
      env:
      - name: NVIDIA_VISIBLE_DEVICES
        value: all
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: compute,utility
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '4'
          memory: 8Gi
          nvidia.com/gpu: '1'
  - name: surrogate-train
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 10Gi
    inputs:
      parameters:
      - name: base_path
      - name: train_features
      - name: train_labels
      - name: validation_features
      - name: validation_labels
      - name: model_path
      - name: features
        default: 'null'
      - name: eval_percents
        default: 'null'
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: eval_percents = json.loads(r'''{{inputs.parameters.eval_percents}}''')
        except: eval_percents = r'''{{inputs.parameters.eval_percents}}'''
        try: features = json.loads(r'''{{inputs.parameters.features}}''')
        except: features = r'''{{inputs.parameters.features}}'''
        try: model_path = json.loads(r'''{{inputs.parameters.model_path}}''')
        except: model_path = r'''{{inputs.parameters.model_path}}'''
        try: train_features = json.loads(r'''{{inputs.parameters.train_features}}''')
        except: train_features = r'''{{inputs.parameters.train_features}}'''
        try: train_labels = json.loads(r'''{{inputs.parameters.train_labels}}''')
        except: train_labels = r'''{{inputs.parameters.train_labels}}'''
        try: validation_features = json.loads(r'''{{inputs.parameters.validation_features}}''')
        except: validation_features = r'''{{inputs.parameters.validation_features}}'''
        try: validation_labels = json.loads(r'''{{inputs.parameters.validation_labels}}''')
        except: validation_labels = r'''{{inputs.parameters.validation_labels}}'''

        import subprocess
        cmd = ['surrogate-train', '--source-root', base_path, '--train-features', train_features, '--train-labels', train_labels, '--validation-features', validation_features, '--validation-labels', validation_labels, '--model-path', model_path]
        if features:
            for feature in features:
                cmd.extend(['--features', feature])
        if eval_percents:
            for pct in eval_percents:
                cmd.extend(['--eval-percents', str(pct)])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '8'
          memory: 16Gi
        requests:
          cpu: '8'
          memory: 16Gi
  - name: surrogate-sample-by-prediction
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 10Gi
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: featurized_input_prefix
      - name: preprocessed_input_prefix
      - name: output_prefix
      - name: seed
      - name: num_random
      - name: num_top
      - name: model_path
      - name: exclude_inputs
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: exclude_inputs = json.loads(r'''{{inputs.parameters.exclude_inputs}}''')
        except: exclude_inputs = r'''{{inputs.parameters.exclude_inputs}}'''
        try: featurized_input_prefix = json.loads(r'''{{inputs.parameters.featurized_input_prefix}}''')
        except: featurized_input_prefix = r'''{{inputs.parameters.featurized_input_prefix}}'''
        try: model_path = json.loads(r'''{{inputs.parameters.model_path}}''')
        except: model_path = r'''{{inputs.parameters.model_path}}'''
        try: num_random = json.loads(r'''{{inputs.parameters.num_random}}''')
        except: num_random = r'''{{inputs.parameters.num_random}}'''
        try: num_top = json.loads(r'''{{inputs.parameters.num_top}}''')
        except: num_top = r'''{{inputs.parameters.num_top}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: preprocessed_input_prefix = json.loads(r'''{{inputs.parameters.preprocessed_input_prefix}}''')
        except: preprocessed_input_prefix = r'''{{inputs.parameters.preprocessed_input_prefix}}'''
        try: seed = json.loads(r'''{{inputs.parameters.seed}}''')
        except: seed = r'''{{inputs.parameters.seed}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import os
        import subprocess
        command = ['surrogate-sample', '--source-root', base_path, '--featurized-input', os.path.join(base_path, featurized_input_prefix, source), '--preprocessed-input', os.path.join(base_path, preprocessed_input_prefix, source), '--output', os.path.join(base_path, output_prefix, source), '--num-random', str(num_random), '--num-top', str(num_top), '--seed', str(seed)]
        if model_path:
            command += ['--model', os.path.join(base_path, model_path)]
        for pattern in exclude_inputs:
            command += ['--exclude-input', os.path.join(base_path, pattern)]
        subprocess.run(command, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '2'
          memory: 4Gi
        requests:
          cpu: '2'
          memory: 4Gi
  - name: merge-shards
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: input_path
      - name: output_path
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: input_path = json.loads(r'''{{inputs.parameters.input_path}}''')
        except: input_path = r'''{{inputs.parameters.input_path}}'''
        try: output_path = json.loads(r'''{{inputs.parameters.output_path}}''')
        except: output_path = r'''{{inputs.parameters.output_path}}'''

        import os
        import subprocess
        subprocess.run(['merge-shards', '--source-root', base_path, '--input', os.path.join(base_path, input_path), '--output', os.path.join(base_path, output_path), '--memory-limit', '6GB'], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 6Gi
        requests:
          cpu: '4'
          memory: 6Gi
  - name: plan-surrogate-sample
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: featurized_prefix
      - name: preprocessed_prefix
      - name: persist_file
      - name: source_glob
        default: '*.parquet'
      - name: model_path
        default: ''
      - name: output_file
        default: /tmp/manifest.json
    outputs:
      parameters:
      - name: manifest
        valueFrom:
          path: /tmp/manifest.json
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: featurized_prefix = json.loads(r'''{{inputs.parameters.featurized_prefix}}''')
        except: featurized_prefix = r'''{{inputs.parameters.featurized_prefix}}'''
        try: model_path = json.loads(r'''{{inputs.parameters.model_path}}''')
        except: model_path = r'''{{inputs.parameters.model_path}}'''
        try: output_file = json.loads(r'''{{inputs.parameters.output_file}}''')
        except: output_file = r'''{{inputs.parameters.output_file}}'''
        try: persist_file = json.loads(r'''{{inputs.parameters.persist_file}}''')
        except: persist_file = r'''{{inputs.parameters.persist_file}}'''
        try: preprocessed_prefix = json.loads(r'''{{inputs.parameters.preprocessed_prefix}}''')
        except: preprocessed_prefix = r'''{{inputs.parameters.preprocessed_prefix}}'''
        try: source_glob = json.loads(r'''{{inputs.parameters.source_glob}}''')
        except: source_glob = r'''{{inputs.parameters.source_glob}}'''

        import os
        import subprocess
        cmd = ['plan-surrogate-sample', '--source-root', base_path, '--featurized-glob', os.path.join(featurized_prefix, source_glob), '--preprocessed-glob', os.path.join(preprocessed_prefix, source_glob), '--output-file', output_file, '--persist-file', os.path.join(base_path, persist_file)]
        if model_path:
            cmd.extend(['--model-file', model_path])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: verify-manifest-surrogate
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: manifest
      - name: expect
      - name: source_globs
      - name: result_file
    outputs:
      parameters:
      - name: matches
        valueFrom:
          path: /tmp/manifest_matches.txt
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: expect = json.loads(r'''{{inputs.parameters.expect}}''')
        except: expect = r'''{{inputs.parameters.expect}}'''
        try: manifest = json.loads(r'''{{inputs.parameters.manifest}}''')
        except: manifest = r'''{{inputs.parameters.manifest}}'''
        try: result_file = json.loads(r'''{{inputs.parameters.result_file}}''')
        except: result_file = r'''{{inputs.parameters.result_file}}'''
        try: source_globs = json.loads(r'''{{inputs.parameters.source_globs}}''')
        except: source_globs = r'''{{inputs.parameters.source_globs}}'''

        import json
        import os
        import subprocess
        cmd = ['verify-manifest', '--manifest', os.path.join(base_path, manifest), '--expect', json.dumps(expect), '--source-root', base_path, '--result-file', result_file]
        for source_glob in source_globs:
            cmd.extend(['--source-glob', source_glob])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: update-manifest-surrogate
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: output
      - name: fields
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: fields = json.loads(r'''{{inputs.parameters.fields}}''')
        except: fields = r'''{{inputs.parameters.fields}}'''
        try: output = json.loads(r'''{{inputs.parameters.output}}''')
        except: output = r'''{{inputs.parameters.output}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import json
        import os
        import subprocess
        subprocess.run(['update-manifest', '--source', os.path.join(base_path, source), '--output', os.path.join(base_path, output), '--set', json.dumps(fields)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: sample-dag-round-0
    dag:
      tasks:
      - name: plan-sources
        template: plan-surrogate-sample
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: featurized_prefix
            value: candidates/10m/featurized/shards
          - name: preprocessed_prefix
            value: candidates/10m/preprocessed/shards
          - name: persist_file
            value: /mnt/lynceus/ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/ptprb-10m-100k-valid-5-rounds-10k/rounds/round_0/features.parquet.manifest.plan.json
      - name: check-sampled
        depends: plan-sources
        template: verify-manifest-surrogate
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: manifest
            value: /mnt/lynceus/ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/ptprb-10m-100k-valid-5-rounds-10k/rounds/round_0/features.parquet.manifest.state.json
          - name: expect
            value: '{"exclude_inputs":["/mnt/lynceus/ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/validation/n100000_seed1000/features.parquet"],"model_path":"","num_random":20,"num_shards":512,"num_top":0,"sampled":true,"seed":1001}'
          - name: source_globs
            value: '["candidates/10m/featurized/*.parquet", "candidates/10m/preprocessed/*.parquet",
              "ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/validation/n100000_seed1000/features.parquet"]'
          - name: result_file
            value: /tmp/manifest_matches.txt
      - name: check-merged
        depends: plan-sources
        template: verify-manifest-surrogate
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: manifest
            value: /mnt/lynceus/ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/ptprb-10m-100k-valid-5-rounds-10k/rounds/round_0/features.parquet.manifest.state.json
          - name: expect
            value: '{"exclude_inputs":["/mnt/lynceus/ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/validation/n100000_seed1000/features.parquet"],"merged":true,"model_path":"","num_random":20,"num_shards":512,"num_top":0,"seed":1001}'
          - name: source_globs
            value: '["candidates/10m/featurized/*.parquet", "candidates/10m/preprocessed/*.parquet",
              "ensembles/{{inputs.parameters.ensemble}}/surrogate/site_{{inputs.parameters.site_id}}/10m/validation/n100000_seed1000/features.parquet"]'
          - name: result_file
            value: /tmp/manifest_matches.txt
      - name: sample-shards
        depends: check-sampled
        template: surrogate-sample-by-prediction
        when: '{{tasks.check-sampled.outputs.parameters.matches}} == false'
