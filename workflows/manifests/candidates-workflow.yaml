  - name: clean-staging-end
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-pvc
    container:
      image: alpine:3.20
      args:
      - test -n "$1" && rm -rf "$0/$1"
      - '{{inputs.parameters.base_path}}'
      - '{{inputs.parameters.prefix}}'
      command:
      - sh
      - -c
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
    inputs:
      parameters:
      - name: base_path
      - name: prefix
  - name: generate-conformers
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: input_prefix
      - name: output_prefix
      - name: num_workers
        default: auto
      - name: batch_size
        default: '10000'
      - name: chunk_size
        default: '25'
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: batch_size = json.loads(r'''{{inputs.parameters.batch_size}}''')
        except: batch_size = r'''{{inputs.parameters.batch_size}}'''
        try: chunk_size = json.loads(r'''{{inputs.parameters.chunk_size}}''')
        except: chunk_size = r'''{{inputs.parameters.chunk_size}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import os
        import subprocess
        subprocess.run(['generate-conformers', '--input', os.path.join(base_path, input_prefix, source), '--output', os.path.join(base_path, output_prefix, source), '--batch-size', str(batch_size), '--chunk-size', str(chunk_size), '--num-workers', str(num_workers)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: generate-features
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: input_prefix
      - name: output_prefix
      - name: features
      - name: num_workers
        default: auto
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: features = json.loads(r'''{{inputs.parameters.features}}''')
        except: features = r'''{{inputs.parameters.features}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import os
        import subprocess
        cmd = ['generate-features', '--input', os.path.join(base_path, input_prefix, source), '--output', os.path.join(base_path, output_prefix, source), '--num-workers', str(num_workers)]
        for feature in features:
            cmd.extend(['--features', feature])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: process-shard-dag
    dag:
      tasks:
      - name: generate-conformers
        template: generate-conformers
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: '{{inputs.parameters.source}}'
          - name: input_prefix
            value: candidates/10m/shards
          - name: output_prefix
            value: candidates/10m/conformers
      - name: generate-features
        depends: generate-conformers
        template: generate-features
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: '{{inputs.parameters.source}}'
          - name: input_prefix
            value: candidates/10m/conformers
          - name: output_prefix
            value: candidates/10m/features
          - name: features
            value: '["atom_pair", "autocorr", "descriptors", "ecfp", "functional_groups",
              "morse", "rdf", "topological_torsion", "usrcat", "whim"]'
    inputs:
      parameters:
      - name: source
