apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: 10m-poc-candidates-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: process-source-dag
    dag:
      tasks:
      - name: load-candidates
        template: load-candidates
        arguments:
          parameters:
          - name: source
            value: '{{inputs.parameters.source}}'
          - name: mount_path
            value: /mnt/data
          - name: source_prefix
            value: candidates/raw/smiles
          - name: parquet_prefix
            value: candidates/raw/parquet/{{inputs.parameters.source}}
      - name: shard-candidates
        depends: load-candidates
        template: shard-candidates
        arguments:
          parameters:
          - name: mount_path
            value: /mnt/data
          - name: input_prefix
            value: candidates/raw/parquet/{{inputs.parameters.source}}
          - name: output_prefix
            value: candidates/shards_staging
          - name: num_shards
            value: '1024'
    inputs:
      parameters:
      - name: source
  - name: load-candidates
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-bucket-pvc
    inputs:
      parameters:
      - name: source
      - name: mount_path
      - name: source_prefix
      - name: parquet_prefix
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: mount_path = json.loads(r'''{{inputs.parameters.mount_path}}''')
        except: mount_path = r'''{{inputs.parameters.mount_path}}'''
        try: parquet_prefix = json.loads(r'''{{inputs.parameters.parquet_prefix}}''')
        except: parquet_prefix = r'''{{inputs.parameters.parquet_prefix}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''
        try: source_prefix = json.loads(r'''{{inputs.parameters.source_prefix}}''')
        except: source_prefix = r'''{{inputs.parameters.source_prefix}}'''

        import os
        import subprocess
        subprocess.run(['load-candidates', '--input', os.path.join(mount_path, source_prefix, source), '--output', os.path.join(mount_path, parquet_prefix)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: shard-candidates
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-bucket-pvc
    inputs:
      parameters:
      - name: mount_path
      - name: input_prefix
      - name: output_prefix
      - name: num_shards
      - name: id_column
        default: id
      - name: num_workers
        default: auto
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: id_column = json.loads(r'''{{inputs.parameters.id_column}}''')
        except: id_column = r'''{{inputs.parameters.id_column}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: mount_path = json.loads(r'''{{inputs.parameters.mount_path}}''')
        except: mount_path = r'''{{inputs.parameters.mount_path}}'''
        try: num_shards = json.loads(r'''{{inputs.parameters.num_shards}}''')
        except: num_shards = r'''{{inputs.parameters.num_shards}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''

        import os
        import subprocess
        subprocess.run(['shard-candidates', '--input', os.path.join(mount_path, input_prefix), '--output', os.path.join(mount_path, output_prefix), '--num-shards', str(num_shards), '--id-column', id_column, '--num-workers', str(num_workers)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: main-dag
    dag:
