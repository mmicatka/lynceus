apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: 10m-poc-candidates-pipeline-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: load-candidates-dag
    dag:
      tasks:
      - name: plan-shard
        template: plan-shard-candidates
        arguments:
          parameters:
          - name: source_root
            value: /mnt/lynceus
          - name: source_glob
            value: candidates/raw/smiles/**/*.smi.gz
          - name: output_file
            value: /tmp/manifest.json
          - name: max_batch_gib
            value: '10'
          - name: persist_file
            value: /mnt/lynceus/candidates/raw/shards/manifests/load_plan.json
      - name: check-sharded
        depends: plan-shard
        template: verify-manifest-candidates
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: manifest
            value: /mnt/lynceus/candidates/raw/shards/manifests/candidate_shards.manifest.json
          - name: expect
            value: '{"num_shards":512,"scheme":"zinc22-id-hash-mod-v1","sharded":true}'
          - name: source_glob
            value: candidates/raw/smiles/**/*.smi.gz
          - name: result_file
            value: /tmp/manifest_matches.txt
      - name: check-merged
        depends: plan-shard
        template: verify-manifest-candidates
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: manifest
            value: /mnt/lynceus/candidates/raw/shards/manifests/candidate_shards.manifest.json
          - name: expect
            value: '{"merged":true,"num_shards":512,"scheme":"zinc22-id-hash-mod-v1"}'
          - name: source_glob
            value: candidates/raw/smiles/**/*.smi.gz
          - name: result_file
            value: /tmp/manifest_matches.txt
      - name: verify-final-shards
        depends: check-sharded
        template: verify-shard-layout
        when: '{{tasks.check-sharded.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: check
            value: final-shards-in-range
          - name: num_shards
            value: '512'
          - name: filename_template
            value: shard_{id}.parquet
          - name: folder_prefix
            value: shard_id=
          - name: shards_dir
            value: candidates/raw/shards/merged
          - name: staging_dir
            value: candidates/raw/shards/staging
      - name: shard-candidates
        depends: verify-final-shards
        template: shard-candidates-dag
        when: '{{tasks.check-sharded.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: batches
            value: '{{=toJson(fromJSON(tasks[''plan-shard''].outputs.parameters.manifest).batches)}}'
      - name: verify-staging
        depends: shard-candidates
        template: verify-shard-layout
        when: '{{tasks.check-sharded.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: check
            value: staging-complete
          - name: num_shards
            value: '512'
          - name: filename_template
            value: shard_{id}.parquet
          - name: folder_prefix
            value: shard_id=
          - name: shards_dir
            value: candidates/raw/shards/merged
          - name: staging_dir
            value: candidates/raw/shards/staging
      - name: write-manifest
        depends: verify-staging
        template: update-manifest
        when: '{{tasks.check-sharded.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: /mnt/lynceus/candidates/raw/shards/manifests/load_plan.json
          - name: output
            value: /mnt/lynceus/candidates/raw/shards/manifests/candidate_shards.manifest.json
          - name: fields
            value: '{"num_shards":512,"scheme":"zinc22-id-hash-mod-v1","sharded":true}'
      - name: merge-shards
        depends: write-manifest && check-merged
        template: merge-shards-dag
        when: '{{tasks.check-merged.outputs.parameters.matches}} == false'
      - name: verify-merged
        depends: merge-shards
        template: verify-shard-layout
        when: '{{tasks.check-merged.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: check
            value: merge-complete
          - name: num_shards
            value: '512'
          - name: filename_template
            value: shard_{id}.parquet
          - name: folder_prefix
            value: shard_id=
          - name: shards_dir
            value: candidates/raw/shards/merged
          - name: staging_dir
            value: candidates/raw/shards/staging
      - name: mark-merged
        depends: verify-merged
        template: update-manifest
        when: '{{tasks.check-merged.outputs.parameters.matches}} == false'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: /mnt/lynceus/candidates/raw/shards/manifests/candidate_shards.manifest.json
          - name: output
            value: /mnt/lynceus/candidates/raw/shards/manifests/candidate_shards.manifest.json
          - name: fields
            value: '{"merged":true}'
      - name: clean-staging-end
        depends: mark-merged
        template: clean-staging-end
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: prefix
            value: candidates/raw/shards/staging
  - name: verify-manifest-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: manifest
      - name: expect
      - name: source_glob
      - name: result_file
    outputs:
      parameters:
      - name: matches
        valueFrom:
          path: /tmp/manifest_matches.txt
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: expect = json.loads(r'''{{inputs.parameters.expect}}''')
        except: expect = r'''{{inputs.parameters.expect}}'''
        try: manifest = json.loads(r'''{{inputs.parameters.manifest}}''')
        except: manifest = r'''{{inputs.parameters.manifest}}'''
        try: result_file = json.loads(r'''{{inputs.parameters.result_file}}''')
        except: result_file = r'''{{inputs.parameters.result_file}}'''
        try: source_glob = json.loads(r'''{{inputs.parameters.source_glob}}''')
        except: source_glob = r'''{{inputs.parameters.source_glob}}'''

        import json
        import os
        import subprocess
        subprocess.run(['verify-manifest', '--manifest', os.path.join(base_path, manifest), '--expect', json.dumps(expect), '--source-root', base_path, '--source-glob', source_glob, '--result-file', result_file], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: verify-shard-layout
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: check
      - name: num_shards
      - name: filename_template
      - name: folder_prefix
      - name: shards_dir
      - name: staging_dir
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: check = json.loads(r'''{{inputs.parameters.check}}''')
        except: check = r'''{{inputs.parameters.check}}'''
        try: filename_template = json.loads(r'''{{inputs.parameters.filename_template}}''')
        except: filename_template = r'''{{inputs.parameters.filename_template}}'''
        try: folder_prefix = json.loads(r'''{{inputs.parameters.folder_prefix}}''')
        except: folder_prefix = r'''{{inputs.parameters.folder_prefix}}'''
        try: num_shards = json.loads(r'''{{inputs.parameters.num_shards}}''')
        except: num_shards = r'''{{inputs.parameters.num_shards}}'''
        try: shards_dir = json.loads(r'''{{inputs.parameters.shards_dir}}''')
        except: shards_dir = r'''{{inputs.parameters.shards_dir}}'''
        try: staging_dir = json.loads(r'''{{inputs.parameters.staging_dir}}''')
        except: staging_dir = r'''{{inputs.parameters.staging_dir}}'''

        import os
        import subprocess
        subprocess.run(['verify-shard-layout', '--check', check, '--num-shards', str(num_shards), '--filename-template', filename_template, '--folder-prefix', folder_prefix, '--shards-dir', os.path.join(base_path, shards_dir), '--staging-dir', os.path.join(base_path, staging_dir)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: update-manifest
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: output
      - name: fields
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: fields = json.loads(r'''{{inputs.parameters.fields}}''')
        except: fields = r'''{{inputs.parameters.fields}}'''
        try: output = json.loads(r'''{{inputs.parameters.output}}''')
        except: output = r'''{{inputs.parameters.output}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''

        import json
        import os
        import subprocess
        subprocess.run(['update-manifest', '--source', os.path.join(base_path, source), '--output', os.path.join(base_path, output), '--set', json.dumps(fields)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: plan-shard-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: source_root
      - name: source_glob
      - name: output_file
      - name: persist_file
      - name: max_batch_gib
    outputs:
      parameters:
      - name: manifest
        valueFrom:
          path: /tmp/manifest.json
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: max_batch_gib = json.loads(r'''{{inputs.parameters.max_batch_gib}}''')
        except: max_batch_gib = r'''{{inputs.parameters.max_batch_gib}}'''
        try: output_file = json.loads(r'''{{inputs.parameters.output_file}}''')
        except: output_file = r'''{{inputs.parameters.output_file}}'''
        try: persist_file = json.loads(r'''{{inputs.parameters.persist_file}}''')
        except: persist_file = r'''{{inputs.parameters.persist_file}}'''
        try: source_glob = json.loads(r'''{{inputs.parameters.source_glob}}''')
        except: source_glob = r'''{{inputs.parameters.source_glob}}'''
        try: source_root = json.loads(r'''{{inputs.parameters.source_root}}''')
        except: source_root = r'''{{inputs.parameters.source_root}}'''

        import os
        import subprocess
        args = ['plan-load-candidates', '--source-root', source_root, '--source-glob', source_glob, '--output-file', output_file, '--persist-file', os.path.join(source_root, persist_file), '--max-batch-gib', max_batch_gib]
        subprocess.run([str(arg) for arg in args], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: shard-candidates-dag
    parallelism: 8
    dag:
      tasks:
      - name: shard-candidates
        template: shard-candidates
        withParam: '{{inputs.parameters.batches}}'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: batch
            value: '{{item}}'
          - name: output_prefix
            value: candidates/raw/shards/staging
          - name: num_shards
            value: '512'
          - name: scratch_dir
            value: /scratch
    inputs:
      parameters:
      - name: batches
  - name: shard-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: batch
      - name: output_prefix
      - name: num_shards
      - name: scratch_dir
        default: ''
      - name: transfers
        default: ''
      - name: chunk_size
        default: ''
      - name: max_buffered_rows
        default: ''
      - name: num_workers
        default: ''
    retryStrategy:
      limit: 3
      retryPolicy: OnFailure
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: batch = json.loads(r'''{{inputs.parameters.batch}}''')
        except: batch = r'''{{inputs.parameters.batch}}'''
        try: chunk_size = json.loads(r'''{{inputs.parameters.chunk_size}}''')
        except: chunk_size = r'''{{inputs.parameters.chunk_size}}'''
        try: max_buffered_rows = json.loads(r'''{{inputs.parameters.max_buffered_rows}}''')
        except: max_buffered_rows = r'''{{inputs.parameters.max_buffered_rows}}'''
        try: num_shards = json.loads(r'''{{inputs.parameters.num_shards}}''')
        except: num_shards = r'''{{inputs.parameters.num_shards}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: scratch_dir = json.loads(r'''{{inputs.parameters.scratch_dir}}''')
        except: scratch_dir = r'''{{inputs.parameters.scratch_dir}}'''
        try: transfers = json.loads(r'''{{inputs.parameters.transfers}}''')
        except: transfers = r'''{{inputs.parameters.transfers}}'''

        import os
        import subprocess
        optional_flags = {'--scratch-dir': scratch_dir, '--transfers': transfers, '--chunk-size': chunk_size, '--max-buffered-rows': max_buffered_rows, '--num-workers': num_workers}
        extra_args = [arg for flag, value in optional_flags.items() if value != '' for arg in (flag, str(value))]
        output = os.path.join(base_path, output_prefix)
        cmd = ['shard-candidates']
        for path in batch:
            cmd.extend(['--input', os.path.join(base_path, path)])
        cmd.extend(['--output', output, '--num-shards', str(num_shards), *extra_args])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: merge-and-clean-shard
    dag:
      tasks:
      - name: merge-shard
        template: merge-shards
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: input_path
            value: candidates/raw/shards/staging/shard_id={{inputs.parameters.shard_id}}
          - name: output_path
            value: candidates/raw/shards/merged/shard_{{inputs.parameters.shard_id}}.parquet
          - name: memory_limit
            value: 6Gi
      - name: clean-shard
        depends: merge-shard
        template: clean-shard-template
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: prefix
            value: candidates/raw/shards/staging/shard_id={{inputs.parameters.shard_id}}
    inputs:
      parameters:
      - name: shard_id
  - name: merge-shards
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: input_path
      - name: output_path
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: input_path = json.loads(r'''{{inputs.parameters.input_path}}''')
        except: input_path = r'''{{inputs.parameters.input_path}}'''
        try: output_path = json.loads(r'''{{inputs.parameters.output_path}}''')
        except: output_path = r'''{{inputs.parameters.output_path}}'''

        import os
        import subprocess
        subprocess.run(['merge-shards', '--source-root', base_path, '--input', os.path.join(base_path, input_path), '--output', os.path.join(base_path, output_path), '--memory-limit', '6GB'], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 6Gi
        requests:
          cpu: '4'
          memory: 6Gi
  - name: clean-shard-template
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-pvc
    container:
      image: alpine:3.20
      args:
      - test -n "$1" && rm -rf "$0/$1"
      - '{{inputs.parameters.base_path}}'
      - '{{inputs.parameters.prefix}}'
      command:
      - sh
      - -c
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
    inputs:
      parameters:
      - name: base_path
      - name: prefix
  - name: merge-shards-dag
    parallelism: 1
    dag:
      tasks:
      - name: merge-shards-fanout
