  - name: merge-shards
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-bucket-pvc
    inputs:
      parameters:
      - name: mount_path
      - name: input_prefix
      - name: output_prefix
      - name: num_workers
        default: auto
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: mount_path = json.loads(r'''{{inputs.parameters.mount_path}}''')
        except: mount_path = r'''{{inputs.parameters.mount_path}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''

        import os
        import subprocess
        subprocess.run(['merge-shards', '--input', os.path.join(mount_path, input_prefix), '--output', os.path.join(mount_path, output_prefix), '--num-workers', str(num_workers)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
      resources:
        limits:
          cpu: '4'
          memory: 4Gi
        requests:
          cpu: '4'
          memory: 4Gi
  - name: clean-prefix
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-bucket-pvc
    container:
      image: alpine:3.20
      args:
      - test -n "$1" && rm -rf "$0/$1"
      - '{{inputs.parameters.mount_path}}'
      - '{{inputs.parameters.prefix}}'
      command:
      - sh
      - -c
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
    inputs:
      parameters:
      - name: mount_path
      - name: prefix
