      - name: cleanup-staging
        depends: merge-shards
        template: clean-prefix
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: prefix
            value: candidates/shards_staging
  - name: merge-shards
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: input_path
      - name: output_path
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: input_path = json.loads(r'''{{inputs.parameters.input_path}}''')
        except: input_path = r'''{{inputs.parameters.input_path}}'''
        try: output_path = json.loads(r'''{{inputs.parameters.output_path}}''')
        except: output_path = r'''{{inputs.parameters.output_path}}'''

        import os
        import subprocess
        subprocess.run(['merge-shards', '--input', os.path.join(base_path, input_path), '--output', os.path.join(base_path, output_path), '--memory-limit', '4GB'], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '8'
          memory: 8Gi
        requests:
          cpu: '8'
          memory: 8Gi
  - name: clean-prefix
    volumes:
    - name: lynceus-data
      persistentVolumeClaim:
        claimName: lynceus-pvc
    container:
      image: alpine:3.20
      args:
      - test -n "$1" && rm -rf "$0/$1"
      - '{{inputs.parameters.base_path}}'
      - '{{inputs.parameters.prefix}}'
      command:
      - sh
      - -c
      volumeMounts:
      - name: lynceus-data
        mountPath: /mnt/data
    inputs:
      parameters:
