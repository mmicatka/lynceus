apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: 5m-poc-candidates-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: verify-manifest
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: manifest_path
      - name: expect
        default: 'null'
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/manifest_matches.txt
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/surrogate-model:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: expect = json.loads(r'''{{inputs.parameters.expect}}''')
        except: expect = r'''{{inputs.parameters.expect}}'''
        try: manifest_path = json.loads(r'''{{inputs.parameters.manifest_path}}''')
        except: manifest_path = r'''{{inputs.parameters.manifest_path}}'''

        import json
        import subprocess
        subprocess.run(['verify-manifest', '--manifest', manifest_path, '--expect', json.dumps(expect or {}), '--result-file', '/tmp/manifest_matches.txt'], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: load-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: source
      - name: source_prefix
      - name: parquet_prefix
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: parquet_prefix = json.loads(r'''{{inputs.parameters.parquet_prefix}}''')
        except: parquet_prefix = r'''{{inputs.parameters.parquet_prefix}}'''
        try: source = json.loads(r'''{{inputs.parameters.source}}''')
        except: source = r'''{{inputs.parameters.source}}'''
        try: source_prefix = json.loads(r'''{{inputs.parameters.source_prefix}}''')
        except: source_prefix = r'''{{inputs.parameters.source_prefix}}'''

        import os
        import subprocess
        subprocess.run(['load-candidates', '--input', os.path.join(base_path, source_prefix, source), '--output', os.path.join(base_path, parquet_prefix)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
        requests:
          cpu: '4'
          memory: 8Gi
  - name: shard-candidates
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    - name: scratch
      emptyDir:
        sizeLimit: 50Gi
    inputs:
      parameters:
      - name: base_path
      - name: input_prefix
      - name: output_prefix
      - name: num_shards
      - name: scratch_path
      - name: max_batch_gib
      - name: transfers
        default: '4'
      - name: id_column
        default: id
      - name: num_workers
        default: auto
      - name: memory_limit
        default: ''
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/candidates:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: id_column = json.loads(r'''{{inputs.parameters.id_column}}''')
        except: id_column = r'''{{inputs.parameters.id_column}}'''
        try: input_prefix = json.loads(r'''{{inputs.parameters.input_prefix}}''')
        except: input_prefix = r'''{{inputs.parameters.input_prefix}}'''
        try: max_batch_gib = json.loads(r'''{{inputs.parameters.max_batch_gib}}''')
        except: max_batch_gib = r'''{{inputs.parameters.max_batch_gib}}'''
        try: memory_limit = json.loads(r'''{{inputs.parameters.memory_limit}}''')
        except: memory_limit = r'''{{inputs.parameters.memory_limit}}'''
        try: num_shards = json.loads(r'''{{inputs.parameters.num_shards}}''')
        except: num_shards = r'''{{inputs.parameters.num_shards}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: scratch_path = json.loads(r'''{{inputs.parameters.scratch_path}}''')
        except: scratch_path = r'''{{inputs.parameters.scratch_path}}'''
        try: transfers = json.loads(r'''{{inputs.parameters.transfers}}''')
        except: transfers = r'''{{inputs.parameters.transfers}}'''

        import os
        import subprocess
        cmd = ['shard-candidates', '--input', os.path.join(base_path, input_prefix), '--output', os.path.join(base_path, output_prefix), '--scratch-dir', scratch_path, '--num-shards', str(num_shards), '--max-batch-gib', str(max_batch_gib), '--transfers', str(transfers), '--id-column', id_column, '--num-workers', str(num_workers)]
        if memory_limit:
            cmd.extend(['--memory-limit', memory_limit])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      - name: scratch
        mountPath: /scratch
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
        requests:
          cpu: '4'
          memory: 8Gi
  - name: process-source-dag
    dag:
      tasks:
      - name: verify-manifest
        template: verify-manifest
        arguments:
          parameters:
          - name: manifest_path
            value: /mnt/lynceus/candidates/shards_staging.{{inputs.parameters.source}}.manifest.json
          - name: expect
            value: '{"input_path": "/mnt/lynceus/candidates/raw/parquet/{{inputs.parameters.source}}",
              "output_path": "/mnt/lynceus/candidates/shards_staging", "num_shards":
              256, "max_batch_gib": 20}'
      - name: load-candidates
        depends: verify-manifest
        template: load-candidates
        when: '{{tasks.verify-manifest.outputs.parameters.result}} != true'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: source
            value: '{{inputs.parameters.source}}'
          - name: source_prefix
            value: candidates/raw/smiles
          - name: parquet_prefix
            value: candidates/raw/parquet/{{inputs.parameters.source}}
      - name: shard-candidates
        depends: load-candidates
        template: shard-candidates
        when: '{{tasks.verify-manifest.outputs.parameters.result}} != true'
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: input_prefix
            value: candidates/raw/parquet/{{inputs.parameters.source}}
          - name: output_prefix
            value: candidates/shards_staging
          - name: num_shards
            value: '256'
          - name: scratch_path
            value: /scratch
          - name: max_batch_gib
            value: '20'
          - name: memory_limit
            value: 8Gi
    inputs:
      parameters:
      - name: source
  - name: load-candidates-dag
    parallelism: 3
    dag:
      tasks:
      - name: process-sources
        template: process-source-dag
        withItems:
        - H04
        - H05
        - H06
        - H07
        - H08
        - H09
        - H10
