apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ptprb-10m-1m-valid-5-rounds-10k-targets-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: download-pdbs
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: pdb_ids
      - name: output_prefix
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: pdb_ids = json.loads(r'''{{inputs.parameters.pdb_ids}}''')
        except: pdb_ids = r'''{{inputs.parameters.pdb_ids}}'''

        import os
        import subprocess
        subprocess.run(['download-pdbs', '--pdb-ids', pdb_ids, '--outdir', os.path.join(base_path, output_prefix)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: generate-protein-ensemble-manifest
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: input_path
      - name: output_path
      - name: ensemble_id
      - name: structure_glob
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: ensemble_id = json.loads(r'''{{inputs.parameters.ensemble_id}}''')
        except: ensemble_id = r'''{{inputs.parameters.ensemble_id}}'''
        try: input_path = json.loads(r'''{{inputs.parameters.input_path}}''')
        except: input_path = r'''{{inputs.parameters.input_path}}'''
        try: output_path = json.loads(r'''{{inputs.parameters.output_path}}''')
        except: output_path = r'''{{inputs.parameters.output_path}}'''
        try: structure_glob = json.loads(r'''{{inputs.parameters.structure_glob}}''')
        except: structure_glob = r'''{{inputs.parameters.structure_glob}}'''

        import os
        import subprocess
        subprocess.run(['generate-manifest', '--input', os.path.join(base_path, input_path), '--output', os.path.join(base_path, output_path), '--id', ensemble_id, '--structure-glob', structure_glob], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: load-targets
    dag:
      tasks:
      - name: download-pdbs-ptprb-single
        template: download-pdbs
        arguments:
          parameters:
          - name: pdb_ids
            value: 2AHS
          - name: base_path
            value: /mnt/lynceus
          - name: output_prefix
            value: ensembles/PTPRB_Single/pdbs
      - name: generate-manifest-ptprb-single
        depends: download-pdbs-ptprb-single
        template: generate-protein-ensemble-manifest
        arguments:
          parameters:
          - name: base_path
            value: /mnt/lynceus
          - name: input_path
            value: ensembles/PTPRB_Single/pdbs
          - name: output_path
            value: ensembles/PTPRB_Single/structures
          - name: ensemble_id
            value: PTPRB_Single
          - name: structure_glob
            value: '*'
  - name: detect-binding-sites
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: ensemble_path
      - name: ensemble_id
        default: 'null'
      - name: output_dir
        default: 'null'
      - name: min_pocket_score
        default: '10.0'
      - name: num_workers
        default: auto
    retryStrategy:
      limit: 3
      retryPolicy: Always
    script:
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: ensemble_id = json.loads(r'''{{inputs.parameters.ensemble_id}}''')
        except: ensemble_id = r'''{{inputs.parameters.ensemble_id}}'''
        try: ensemble_path = json.loads(r'''{{inputs.parameters.ensemble_path}}''')
        except: ensemble_path = r'''{{inputs.parameters.ensemble_path}}'''
        try: min_pocket_score = json.loads(r'''{{inputs.parameters.min_pocket_score}}''')
        except: min_pocket_score = r'''{{inputs.parameters.min_pocket_score}}'''
        try: num_workers = json.loads(r'''{{inputs.parameters.num_workers}}''')
        except: num_workers = r'''{{inputs.parameters.num_workers}}'''
        try: output_dir = json.loads(r'''{{inputs.parameters.output_dir}}''')
        except: output_dir = r'''{{inputs.parameters.output_dir}}'''

        import subprocess
        cmd = ['detect-binding-sites', '--ensemble', str(ensemble_path), '--min-pocket-score', str(min_pocket_score), '--num-workers', str(num_workers)]
        if ensemble_id is not None:
            cmd.extend(['--ensemble-id', str(ensemble_id)])
        if output_dir is not None:
            cmd.extend(['--output-dir', str(output_dir)])
        subprocess.run(cmd, check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        requests:
          cpu: '2'
          memory: 2Gi
  - name: detect-binding-sites-dag
    dag:
      tasks:
      - name: detect-binding-sites-ptprb-single
        template: detect-binding-sites
        arguments:
          parameters:
          - name: ensemble_path
            value: /mnt/lynceus/ensembles/PTPRB_Single/structures
          - name: ensemble_id
            value: PTPRB_Single
          - name: output_dir
            value: /mnt/lynceus/ensembles/PTPRB_Single/binding_sites
          - name: min_pocket_score
            value: '10.0'
  - name: main-dag
    dag:
      tasks:
      - name: load-targets
        template: load-targets
      - name: detect-binding-sites
        depends: load-targets
        template: detect-binding-sites-dag
