apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: 10m-poc-download-pdbs-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
  - name: download-pdbs
    volumes:
    - name: lynceus
      persistentVolumeClaim:
        claimName: lynceus-pvc
    inputs:
      parameters:
      - name: base_path
      - name: pdb_ids
      - name: output_prefix
    retryStrategy:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    script:
      image: registry.nebula.lan:5000/lynceus/targets:0.1.0
      imagePullPolicy: Always
      source: |-
        import os
        import sys
        sys.path.append(os.getcwd())
        import json
        try: base_path = json.loads(r'''{{inputs.parameters.base_path}}''')
        except: base_path = r'''{{inputs.parameters.base_path}}'''
        try: output_prefix = json.loads(r'''{{inputs.parameters.output_prefix}}''')
        except: output_prefix = r'''{{inputs.parameters.output_prefix}}'''
        try: pdb_ids = json.loads(r'''{{inputs.parameters.pdb_ids}}''')
        except: pdb_ids = r'''{{inputs.parameters.pdb_ids}}'''

        import os
        import subprocess
        subprocess.run(['download-pdbs', '--pdb-ids', pdb_ids, '--outdir', os.path.join(base_path, output_prefix)], check=True)
      command:
      - python
      volumeMounts:
      - name: lynceus
        mountPath: /mnt/lynceus
      resources:
        limits:
          cpu: '4'
          memory: 3Gi
        requests:
          cpu: '2'
          memory: 1Gi
  - name: download-pdbs-dag
    dag:
      tasks:
      - name: download-pdbs
        template: download-pdbs
        arguments:
          parameters:
          - name: pdb_ids
            value: 1L83
          - name: base_path
            value: /mnt/lynceus
          - name: output_prefix
            value: target/pdbs
  - name: main-dag
    dag:
      tasks:
      - name: download-pdbs
        template: download-pdbs-dag
