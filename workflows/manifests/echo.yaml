---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
    generateName: hera-example-
spec:
    entrypoint: main-dag
    serviceAccountName: argo-workflow
    templates:
        - name: main-dag
          dag:
              tasks:
                  - name: task-a
                    template: echo
                    arguments:
                        parameters:
                            - name: message
                              value: Starting the workflow...
                  - name: task-b
                    depends: task-a
                    template: echo
                    arguments:
                        parameters:
                            - name: message
                              value: Workflow complete!
        - name: echo
          inputs:
              parameters:
                  - name: message
          script:
              image: python:3.10
              source: |-
                  import os
                  import sys
                  sys.path.append(os.getcwd())
                  import json
                  try: message = json.loads(r'''{{inputs.parameters.message}}''')
                  except: message = r'''{{inputs.parameters.message}}'''

                  print(message)
              command:
                  - python
