---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hera-example-
spec:
  entrypoint: main-dag
  serviceAccountName: argo-workflow
  templates:
    - name: main-dag
      dag:
        tasks:
          - name: task-a
            template: echo
            arguments:
              parameters:
                - name: message
                  value: Starting the workflow...
                - name: mount_path
                  value: /mnt/data
          - name: task-b
            depends: task-a
            template: echo
            arguments:
              parameters:
                - name: message
                  value: Workflow complete!
    - name: echo
      volumes:
        - name: lynceus-data
          persistentVolumeClaim:
            claimName: lynceus-bucket-pvc
      inputs:
        parameters:
          - name: message
          - name: mount_path
            default: ''
      script:
        image: python:3.10
        source: |-
          import os
          import sys
          sys.path.append(os.getcwd())
          import json
          try: message = json.loads(r'''{{inputs.parameters.message}}''')
          except: message = r'''{{inputs.parameters.message}}'''
          try: mount_path = json.loads(r'''{{inputs.parameters.mount_path}}''')
          except: mount_path = r'''{{inputs.parameters.mount_path}}'''
          print(message)
          if mount_path:
              test_file = os.path.join(mount_path, 'hera_smoke_test.txt')
              with open(test_file, 'w') as f:
                  f.write(f'Latest message: {message}\n')
        command: [python]
        volumeMounts:
          - name: lynceus-data
            mountPath: /mnt/data
