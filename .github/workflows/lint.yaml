---
name: "Lint"

"on":
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: markdownlint-cli2-action
        uses: DavidAnson/markdownlint-cli2-action@v23.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: YAML
        run: yamllint .
